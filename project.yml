name: NetworkSentinel

options:
  bundleIdPrefix: com.mrblack0407
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  SentinelCore:
    path: SentinelCore

targets:
  NetworkSentinel:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: NetworkSentinel
        excludes:
          - Info.plist
          - NetworkSentinel.entitlements
    dependencies:
      - package: SentinelCore
        product: SentinelCore
    settings:
      base:
        PRODUCT_NAME: NetworkSentinel
        PRODUCT_BUNDLE_IDENTIFIER: com.mrblack0407.NetworkSentinel
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: NetworkSentinel/Info.plist
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_ENTITLEMENTS: NetworkSentinel/NetworkSentinel.entitlements
        DEVELOPMENT_TEAM: ""
        SWIFT_VERSION: "5.0"
        ENABLE_HARDENED_RUNTIME: NO
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        SWIFT_EMIT_LOC_STRINGS: NO
